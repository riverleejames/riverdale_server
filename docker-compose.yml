services:
  # Transmission - Torrent client
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    ports:
      - "${TRANSMISSION_PORT}:9091"
      - "51413:51413"
      - "51413:51413/udp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${USERNAME}
      - PASS=${PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/transmission:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    networks:
      - riverdale_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.lan`)"
      - "traefik.http.routers.transmission.entrypoints=web"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
      - "wud.watch=true"


  # Flood - Modern UI for Transmission
  flood:
    image: jesec/flood:latest
    container_name: flood
    depends_on:
      transmission:
        condition: service_started
    ports:
      - "${FLOOD_PORT:-3000}:3000"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - FLOOD_OPTION_HOST=0.0.0.0
      - FLOOD_OPTION_PORT=3000
      - FLOOD_OPTION_ALLOWEDPATH=/data
      - FLOOD_OPTION_RUNDIR=/config
    volumes:
      - ${CONFIG_ROOT}/flood:/config
      - ${DATA_ROOT}:/data
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flood.rule=Host(`flood.lan`)"
      - "traefik.http.routers.flood.entrypoints=web"
      - "traefik.http.services.flood.loadbalancer.server.port=3000"
      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

  # Plex - Media Server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${CONFIG_ROOT}/plex:/config
      - ${DATA_ROOT}/media:/data/media:ro
      - /dev/shm:/transcode
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:32400/web || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+\\.\\d+$$"

  # Sonarr - TV Show management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "${SONARR_PORT}:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.lan`)"
      - "traefik.http.routers.sonarr.entrypoints=web"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

  # Radarr - Movie management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "${RADARR_PORT}:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.lan`)"
      - "traefik.http.routers.radarr.entrypoints=web"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

  # Prowlarr - Indexer management
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "${PROWLARR_PORT}:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.lan`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

  # Byparr - Cloudflare challenge solver, used as a Prowlarr indexer proxy
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - TZ=${TZ}
    shm_size: 1gb
    restart: unless-stopped
    networks:
      - riverdale_network

  # Seerr - Media request management (successor to Overseerr/Jellyseerr)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    ports:
      - "${SEERR_PORT:-5055}:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.lan`)"
      - "traefik.http.routers.seerr.entrypoints=web"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "wud.watch=true"

  # Telegram Request Bot - Request movies/TV via Telegram (talks to Seerr's API)
  telegram-bot:
    image: chimpanzeesweetrolls/overseerrrequestviatelegrambot:latest
    container_name: telegram-bot
    environment:
      - OVERSEERR_API_URL=http://seerr:5055/api/v1
      - OVERSEERR_API_KEY=${SEERR_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PASSWORD=${TELEGRAM_BOT_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/telegram-bot:/app/data
    restart: unless-stopped
    networks:
      - riverdale_network
    labels:
      - "wud.watch=true"

  # Maintainerr - Automatic library cleanup based on Plex watch status
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/maintainerr:/opt/data
      - ${MEDIA_ROOT}:/data/media
    ports:
      - "${MAINTAINERR_PORT:-6246}:6246"
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD", "/opt/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintainerr.rule=Host(`maintainerr.lan`)"
      - "traefik.http.routers.maintainerr.entrypoints=web"
      - "traefik.http.services.maintainerr.loadbalancer.server.port=6246"
      - "wud.watch=true"

  # Boxarr - Automatically tracks weekly box office top 10 and adds them to Radarr
  boxarr:
    image: ghcr.io/iongpt/boxarr:latest
    container_name: boxarr
    volumes:
      - ${CONFIG_ROOT}/boxarr:/config
    ports:
      - "${BOXARR_PORT:-8888}:8888"
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.boxarr.rule=Host(`boxarr.lan`)"
      - "traefik.http.routers.boxarr.entrypoints=web"
      - "traefik.http.services.boxarr.loadbalancer.server.port=8888"
      - "wud.watch=true"

  # WUD (What's Up Docker) - Container update monitoring
  wud:
    image: getwud/wud:latest
    container_name: wud
    ports:
      - "3100:3000"  # WUD web UI
    environment:
      - TZ=${TZ}
      - WUD_AUTH_ADMIN_USER=${WUD_AUTH_ADMIN_USER}
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_AUTH_ADMIN_PASSWORD}
      - WUD_WATCHER_LOCAL_SOCKET=/var/run/docker.sock
      - WUD_WATCHER_LOCAL_CRON=0 4 * * *  # Daily at 4:00 AM
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=true
      # Docker Compose Trigger - Auto-update containers
      - WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_FILE=/compose/docker-compose.yml
      - WUD_TRIGGER_DOCKERCOMPOSE_docLOCAL_PRUNE=true
      # Ntfy Trigger - Push a notification when a container update is available
      - WUD_TRIGGER_NTFY_NTFY_URL=http://ntfy:80
      - WUD_TRIGGER_NTFY_NTFY_TOPIC=riverdale-updates

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT}/wud:/store
      - /home/river/riverdale_server:/compose:ro
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`wud.lan`)"
      - "traefik.http.routers.wud.entrypoints=web"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"
      - "wud.watch=true"

  # Glances - System monitoring
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    ports:
      - "${GLANCES_PORT:-61208}:61208"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - ${DATA_ROOT}:${DATA_ROOT}:ro
    group_add:
      - "${PGID}"      # Add user group for file access
      - "109"          # Docker group for socket access
    pid: host
    privileged: true  # Still needed for system monitoring
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:61208 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glances.rule=Host(`glances.lan`)"
      - "traefik.http.routers.glances.entrypoints=web"
      - "traefik.http.services.glances.loadbalancer.server.port=61208"
      - "wud.watch=true"

  # Traefik - Reverse Proxy
  traefik:
    image: traefik:latest
    container_name: traefik
    ports:
      - "80:80"      # HTTP traffic for services
      - "443:443"    # HTTPS traffic
      - "8080:8080"  # Traefik dashboard
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT}/traefik:/etc/traefik
      - ${CONFIG_ROOT}/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${CONFIG_ROOT}/traefik/certs:/etc/traefik/certs:ro
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=riverdale_network
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
      - --accesslog=false
      - --providers.docker.watch=true
      - --ping=true
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.lan`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - "wud.watch=true"

  # Homarr - Unified dashboard for all services (V2 public beta)
  homarr:
    image: ghcr.io/homarr-labs/homarr-test:v2
    container_name: homarr
    environment:
      - TZ=${TZ}
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
      - ENABLE_DOCKER=true
      - WORKSHOP_API_URL=https://v2.preview.homarr.dev/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT}/homarr:/appdata
    ports:
      - "${HOMARR_PORT:-7575}:7575"
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7575 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.rule=Host(`homarr.lan`)"
      - "traefik.http.routers.homarr.entrypoints=web"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
      - "wud.watch=true"

  # ntfy - Self-hosted push notifications (phone/desktop) for the other services
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=http://ntfy.lan
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - NTFY_BEHIND_PROXY=true
    volumes:
      - ${CONFIG_ROOT}/ntfy/cache:/var/cache/ntfy
      - ${CONFIG_ROOT}/ntfy/etc:/etc/ntfy
    ports:
      - "${NTFY_PORT:-8090}:80"
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -Eo '\"healthy\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.lan`)"
      - "traefik.http.routers.ntfy.entrypoints=web"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
      - "wud.watch=true"

  # Bazarr - Automatic subtitle downloads for Sonarr/Radarr
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    restart: unless-stopped
    networks:
      - riverdale_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.lan`)"
      - "traefik.http.routers.bazarr.entrypoints=web"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "wud.watch=true"

  # Recyclarr - Syncs TRaSH Guides quality definitions and custom formats into Sonarr/Radarr on a schedule
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config
    restart: unless-stopped
    networks:
      - riverdale_network

  # Paperless-ngx - Document management (OCR / archive)
  paperless-redis:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - riverdale_network
    volumes:
      - ${CONFIG_ROOT}/paperless/redis:/data
    labels:
      # WUD semver watch upgrades 9-alpine -> 9-trixie; pin compose tags
      - "wud.watch=false"

  paperless-db:
    image: docker.io/library/postgres:18
    container_name: paperless-db
    restart: unless-stopped
    networks:
      - riverdale_network
    volumes:
      - ${CONFIG_ROOT}/paperless/pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
    labels:
      # WUD semver watch upgrades 18 -> 19beta*; pin compose tags
      - "wud.watch=false"

  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    container_name: paperless-gotenberg
    restart: unless-stopped
    networks:
      - riverdale_network
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
      - "--api-timeout=60s"
    labels:
      # WUD upgrades 8 -> 8-libreoffice-cloudrun (breaks chromium flags)
      - "wud.watch=false"

  paperless-tika:
    image: docker.io/apache/tika:latest
    container_name: paperless-tika
    restart: unless-stopped
    networks:
      - riverdale_network
    labels:
      - "wud.watch=false"

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-redis
      - paperless-gotenberg
      - paperless-tika
    networks:
      - riverdale_network
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - ${CONFIG_ROOT}/paperless/data:/usr/src/paperless/data
      - ${PAPERLESS_ROOT}/media:/usr/src/paperless/media
      - ${PAPERLESS_ROOT}/consume:/usr/src/paperless/consume
      - ${PAPERLESS_ROOT}/export:/usr/src/paperless/export
    environment:
      - TZ=${TZ}
      - USERMAP_UID=${PUID}
      - USERMAP_GID=${PGID}
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=http://paperless.lan
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_ENDPOINT=http://paperless-tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.lan`)"
      - "traefik.http.routers.paperless.entrypoints=web"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "wud.watch=false"

  # whoami - Simple service for testing Traefik
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped
    networks:
      - riverdale_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.lan`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  riverdale_network:
    name: riverdale_network
    driver: bridge
    external: true